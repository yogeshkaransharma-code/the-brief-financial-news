name: Draft plain-English financial news

on:
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * *'

permissions:
  contents: read

jobs:
  ai-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out official news sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test draft validation logic
        run: python scripts/ai_newsroom.py --self-test

      - name: Generate evidence-backed editorial drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/ai_newsroom.py

      - name: Save drafts privately as workflow artifacts for editorial checks
        uses: actions/upload-artifact@v4
        with:
          name: the-brief-ai-drafts
          path: generated-drafts/
          if-no-files-found: warn
          retention-days: 14
