name: Draft plain-English financial news

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ai_newsroom.py'
      - 'scripts/editorial_gate.py'
      - 'scripts/build_review_packet.py'
      - 'scripts/publish_reviewed.py'
      - 'scripts/test_publishing.py'
      - '.github/workflows/ai-newsroom.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * *'

permissions:
  contents: read

jobs:
  ai-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out official news sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test draft validation logic
        run: python scripts/ai_newsroom.py --self-test

      - name: Test independent editorial rules
        run: python scripts/editorial_gate.py --self-test

      - name: Test approved publication without altering the live site
        run: python scripts/test_publishing.py

      - name: Generate evidence-backed editorial drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo '::error::GEMINI_API_KEY secret is not available to the newsroom workflow'
            exit 1
          fi
          python scripts/ai_newsroom.py

      - name: Build a readable editorial review packet
        if: always()
        run: python scripts/build_review_packet.py

      - name: Save unpublished drafts as workflow artifacts for editorial checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-brief-ai-drafts
          path: generated-drafts/
          if-no-files-found: warn
          retention-days: 14
