name: The Brief — hourly newsroom and site maintenance
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'assets/site.css', '.github/workflows/ai-newsroom.yml', 'index.html', 'about.html', 'data/articles.json', 'data/corrections.json', 'data/source-registry.json']
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'  # Two opportunities per hour; independent watchdog detects misses
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: the-brief-pages
  cancel-in-progress: false
jobs:
  maintenance:
    name: Discover, verify and maintain publication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      outcome: ${{ steps.health.outputs.outcome }}
      new_articles: ${{ steps.health.outputs.new_articles }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source parsers
        run: python -m pip install -r scripts/requirements-newsroom.txt
      - name: Validate editorial and failure controls
        id: controls
        if: github.event_name != 'schedule'
        run: python scripts/run_checks.py
      - name: Discover original-source leads without AI requests
        id: discovery
        continue-on-error: true
        run: python scripts/update_feeds.py
      - name: Refresh internal source-linked discovery leads
        id: headlines
        continue-on-error: true
        run: python scripts/headline_desk.py
      - name: Recover saved source captures, drafts and completed reviews
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const previous = artifacts.filter(a => !a.expired && a.name.startsWith('newsroom-evidence-') &&
              a.workflow_run?.head_branch === 'main' && a.workflow_run?.id !== context.runId)
              .sort((a,b) => Date.parse(b.created_at)-Date.parse(a.created_at) || b.id-a.id)[0];
            if (previous) {
              const zip = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: previous.id, archive_format: 'zip'
              });
              fs.writeFileSync('/tmp/brief-recovery.zip', Buffer.from(zip.data));
              core.info('Recovery artifact: ' + previous.id);
            }
      - name: Restore only validated recovery JSON
        run: |
          if test -f /tmp/brief-recovery.zip; then
            python scripts/newsroom_state.py /tmp/brief-recovery.zip generated-drafts
          fi
      - name: Read sources and write once with Gemini; no independent AI review
        id: writer
        continue-on-error: true
        env:
          BRIEF_AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/newsroom_v2.py
      - name: Publish complete source-based articles with date and duplicate controls
        id: publisher
        continue-on-error: true
        env:
          AUTO_PUBLICATION_ENABLED: '1'
        run: python scripts/publish_autonomous.py
      - name: Refresh accurately dated hourly desk edition without model requests
        id: hourly_desk
        run: python scripts/hourly_desk.py
      - name: Record actual publication outcome and source failures
        id: health
        if: always()
        env:
          BRIEF_PIPELINE_ERROR: ${{ steps.controls.outcome == 'failure' || steps.writer.outcome == 'failure' || steps.publisher.outcome == 'failure' || steps.discovery.outcome == 'failure' || steps.headlines.outcome == 'failure' || steps.hourly_desk.outcome == 'failure' }}
        run: python scripts/newsroom_health.py
      - name: Preserve source evidence and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-evidence-${{ github.run_id }}
          path: generated-drafts/
          retention-days: 90
          if-no-files-found: warn
      - name: Validate provenance and generate today plus complete archive
        run: |
          python scripts/verify_approved_articles.py
          python scripts/sync_fallback.py
      - name: Save articles, request ledger and truthful status
        if: always()
        run: |
          git config user.name "The Brief Newsroom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Record newsroom outcome, evidence approvals and quota usage [skip ci]"
            saved=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                saved=true
                break
              fi
              git fetch origin main
              # Reconcile independent edits; do not choose ours/theirs for article conflicts.
              git rebase origin/main
            done
            test "$saved" = true
          fi
      - name: Build and verify the exact reconciled public artifact
        env:
          # Public Cloudflare site beacon ID from owner's dashboard; not an API secret.
          BRIEF_CF_ANALYTICS_TOKEN: '846ee3304ea145b6a4ba99d81a7e9761'
        run: |
          python scripts/build_public.py
          python scripts/verify_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy readable insurance and banking edition
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual live homepage, archive and original-source links
        id: live
        run: python scripts/verify_live.py
      - name: Install browser for actual mobile checks
        if: steps.health.outputs.new_articles != '0' || github.event_name != 'schedule'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Read actual live site on mobile and desktop
        id: browser
        if: steps.health.outputs.new_articles != '0' || github.event_name != 'schedule'
        run: python scripts/verify_browser.py
      - name: Preserve screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reader-evidence-${{ github.run_id }}
          path: browser-evidence/
          retention-days: 30
          if-no-files-found: ignore
      - name: Record deployment and live reading independently of editorial output
        if: always()
        env:
          BRIEF_TECHNICAL_SUCCESS: ${{ steps.deployment.outcome == 'success' && steps.live.outcome == 'success' && (steps.browser.outcome == 'success' || steps.browser.outcome == 'skipped') }}
          BRIEF_DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
          BRIEF_LIVE_RESULT: ${{ steps.live.outcome }}
          BRIEF_BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          python scripts/finish_run.py
          git add data/run-history.json data/launch-acceptance.json data/reliability.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record observed deployment and live reader result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  publication:
    name: News published — ${{ needs.maintenance.outputs.new_articles }} new articles
    needs: maintenance
    if: needs.maintenance.outputs.outcome == 'PUBLISHED'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actual publication verified. ${{ needs.maintenance.outputs.new_articles }} new reports."
  # Editorial holds are preserved in data/status.json and run history.
  # Do not manufacture a failing Actions job for a correctly held article.
  # A genuinely failed build, deployment or live check still fails maintenance.


