name: The Brief — hourly newsroom and site maintenance
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/ai-newsroom.yml', 'index.html', 'about.html', 'data/articles.json', 'data/corrections.json']
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
    - cron: '2 0,23 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: the-brief-pages
  cancel-in-progress: false
jobs:
  maintenance:
    name: Discover, verify and maintain publication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      outcome: ${{ steps.health.outputs.outcome }}
      new_articles: ${{ steps.health.outputs.new_articles }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source parsers
        run: python -m pip install -r scripts/requirements-newsroom.txt
      - name: Validate editorial and failure controls
        if: github.event_name != 'schedule'
        run: python scripts/run_checks.py
      - name: Discover original-source leads without AI requests
        id: discovery
        continue-on-error: true
        run: python scripts/update_feeds.py
      - name: Read originals, write with Gemini and independently challenge claims
        id: writer
        continue-on-error: true
        env:
          BRIEF_AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/newsroom_v2.py
      - name: Apply final original-date and evidence publication gate
        id: publisher
        continue-on-error: true
        env:
          AUTO_PUBLICATION_ENABLED: '1'
        run: python scripts/publish_autonomous.py
      - name: Record actual publication outcome and source failures
        id: health
        if: always()
        env:
          BRIEF_PIPELINE_ERROR: ${{ steps.writer.outcome == 'failure' || steps.publisher.outcome == 'failure' || steps.discovery.outcome == 'failure' }}
        run: python scripts/newsroom_health.py
      - name: Preserve source evidence and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-evidence-${{ github.run_id }}
          path: generated-drafts/
          retention-days: 90
          if-no-files-found: warn
      - name: Validate provenance and generate today plus complete archive
        run: |
          python scripts/verify_approved_articles.py
          python scripts/sync_fallback.py
          python scripts/build_public.py
          python scripts/verify_public.py
      - name: Save articles, request ledger and truthful status
        if: always()
        run: |
          git config user.name "The Brief Newsroom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Record newsroom outcome, evidence approvals and quota usage"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy readable edition, archive and newsroom status
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual live homepage, archive and original-source links
        run: python scripts/verify_live.py
      - name: Install browser for actual mobile checks
        if: steps.health.outputs.new_articles != '0' || github.event_name != 'schedule'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Read actual live site on mobile and desktop
        if: steps.health.outputs.new_articles != '0' || github.event_name != 'schedule'
        run: python scripts/verify_browser.py
      - name: Preserve screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reader-evidence-${{ github.run_id }}
          path: browser-evidence/
          retention-days: 30
          if-no-files-found: ignore
  publication:
    name: News published — ${{ needs.maintenance.outputs.new_articles }} new articles
    needs: maintenance
    if: needs.maintenance.outputs.outcome == 'PUBLISHED'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actual publication verified. ${{ needs.maintenance.outputs.new_articles }} new reports."
  attention:
    name: Newsroom needs attention — ${{ needs.maintenance.outputs.outcome }}
    needs: maintenance
    if: always() && (needs.maintenance.outputs.outcome == 'BLOCKED' || needs.maintenance.outputs.outcome == 'DEGRADED' || needs.maintenance.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Publication is blocked, discovery is degraded, or live verification failed. Inspect the newsroom summary and evidence artifact. No publication success is claimed."
          exit 1
