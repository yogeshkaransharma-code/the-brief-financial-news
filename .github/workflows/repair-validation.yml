name: Newsroom repair regression checks
on:
  push:
    branches: ['repair/**']
  pull_request:
    paths: ['scripts/**', 'data/source-registry.json', '.github/workflows/**']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-newsroom.txt
      - run: python scripts/run_checks.py
      - run: |
          python scripts/build_public.py
          python scripts/verify_public.py
