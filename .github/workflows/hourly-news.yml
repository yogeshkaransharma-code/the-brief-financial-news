name: Collect and publish financial news

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: the-brief-pages
  cancel-in-progress: false

jobs:
  news-and-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check website JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, 'No website JavaScript found'
          pathlib.Path('/tmp/brief-site.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/brief-site.js

      - name: Python for RSS collection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test newsroom syntax and editorial publishing controls
        run: |
          python -m py_compile scripts/ai_newsroom.py scripts/editorial_gate.py scripts/publish_reviewed.py scripts/build_review_packet.py
          python scripts/ai_newsroom.py --self-test
          python scripts/editorial_gate.py --self-test
          python scripts/test_publishing.py

      - name: Collect fresh source updates
        run: python scripts/update_feeds.py

      - name: Save new updates to the archive
        if: github.event_name != 'push'
        run: |
          git config user.name "The Brief News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "Update financial news"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "News push collided with another update; rebasing (attempt $attempt)"
              git fetch origin main
              git rebase -X theirs origin/main
            done
            echo "Could not save updated archive after retries"
            exit 1
          fi

      - name: Verify live feed and website content
        run: python scripts/verify_site.py

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
