name: Independent live publication health
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["The Brief — hourly newsroom and site maintenance"]
    types: [completed]
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: read
  actions: write
jobs:
  live-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect delayed, missing or failed newsroom cycles and recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recover_schedule.py
      - name: Verify live edition, full archive and monitoring freshness
        run: python scripts/verify_live.py --monitor
      - name: Install browser
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Inspect mobile and desktop reading experience
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-live-reader-evidence
          path: browser-evidence/
          retention-days: 30
          if-no-files-found: warn


