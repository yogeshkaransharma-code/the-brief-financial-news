name: Independent publisher coverage audit — no model requests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit_coverage.py', '.github/workflows/coverage-audit.yml']
permissions:
  contents: write
concurrency:
  group: the-brief-coverage-audit
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-newsroom.txt
      - name: Compare actual publisher pages with the production queue
        run: python scripts/audit_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-coverage-evidence-${{ github.run_id }}
          path: generated-drafts/coverage-audit/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve the actual comparison
        run: |
          git config user.name "The Brief Coverage Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coverage-audit.json
          git commit -m "Record independent publisher coverage comparison"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
